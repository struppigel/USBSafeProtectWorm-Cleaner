name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /optimize+ `
            /r:System.Management.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            /win32manifest:app.manifest /win32icon:app.ico `
            /out:USBSafeProtectWorm-Cleaner.exe USBSafeProtectWorm-Cleaner.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed with exit code $LASTEXITCODE" }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash USBSafeProtectWorm-Cleaner.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  USBSafeProtectWorm-Cleaner.exe" | Set-Content -Encoding ascii USBSafeProtectWorm-Cleaner.exe.sha256

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            USBSafeProtectWorm-Cleaner.exe USBSafeProtectWorm-Cleaner.exe.sha256 `
            --title "${{ github.ref_name }}" --generate-notes --verify-tag
